name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements-dev.txt
      - name: Generate icon
        run: python make_codex_icon.py
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean CodexTokenChecker.spec
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexTokenChecker-windows
          path: dist/CodexTokenChecker.exe
      - name: Attach executable to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CodexTokenChecker.exe
